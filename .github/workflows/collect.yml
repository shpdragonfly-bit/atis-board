name: Collect ATIS

# Runs every 10 minutes. GitHub often starts scheduled runs late (10-20 min)
# under load; that is expected. "Run workflow" on the Actions tab runs it now.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "airports.json", ".github/workflows/collect.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-atis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers when each airport was last fetched, so slower tiers are
      # fetched every 30 or 60 minutes without committing that state.
      - name: Restore fetch state
        uses: actions/cache@v4
        with:
          path: .state
          key: atis-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: atis-state-

      - name: Collect ATIS
        run: python scripts/collect.py

      - name: Commit data if it changed
        run: |
          git config user.name "atis-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -q -m "ATIS update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Keep the schedule enabled
        # GitHub turns off scheduled workflows after 60 days without repository activity.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"

name: Collect ATIS

# Runs every 10 minutes. GitHub often starts scheduled runs late (10-20 min)
# under load; that is expected. "Run workflow" on the Actions tab runs it now.
#
# Collected data is committed to the separate "data" branch, so the web app
# on main (GitHub Pages) is not rebuilt every time an ATIS changes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "airports.json", ".github/workflows/collect.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-atis
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          git config --global user.name "atis-board-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git worktree add -q store FETCH_HEAD
            git -C store checkout -q -B data
          else
            git worktree add -q --detach store
            git -C store checkout -q --orphan data
            git -C store rm -rq --cached . || true
            find store -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            # first run: carry over data collected on main before the split
            if [ -d data ]; then cp -r data/. store/; fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Remembers when each airport was last fetched, so slower tiers are
      # fetched every 30 or 60 minutes without committing that state.
      - name: Restore fetch state
        uses: actions/cache@v4
        with:
          path: .state
          key: atis-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: atis-state-

      - name: Collect ATIS
        env:
          ATIS_DATA_DIR: store
        run: python scripts/collect.py

      - name: Commit data if it changed
        working-directory: store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No data change."
            exit 0
          fi
          git commit -q -m "ATIS update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git pull -q --rebase origin data || true
            sleep 5
          done
          exit 1

      - name: Keep the schedule enabled
        # GitHub turns off scheduled workflows after 60 days without repository activity.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
